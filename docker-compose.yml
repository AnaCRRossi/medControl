version: '3.8'

services:
  medcontrol-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medcontrol-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-sua-chave-secreta-mude-em-producao}
      - JWT_EXPIRATION=24h
    restart: unless-stopped
    networks:
      - medcontrol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  medcontrol-network:
    driver: bridge

# Para usar: docker-compose up -d
# Para parar: docker-compose down
# Para logs: docker-compose logs -f
# Para rebuild: docker-compose up -d --build
